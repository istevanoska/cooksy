<div class="login-page">

  <!-- decorative background -->
  <div class="bg-deco" aria-hidden="true">
    <div class="bg-deco__ring bg-deco__ring--1"></div>
    <div class="bg-deco__ring bg-deco__ring--2"></div>
    <div class="bg-deco__glow"></div>
    <div class="bg-deco__text">COOKSY</div>
  </div>

  <div class="login-card">

    <!-- brand -->
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span class="brand-name">Cooksy</span>
    </div>

    <h1 class="card-title">
      Welcome<br><em>back</em>
    </h1>

    <p class="card-sub">
      Sign in to continue your Cooksy journey
    </p>

    <!-- form -->
    <div class="form-group">
      <label class="form-label">Email</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M1 5.5l7 4.5 7-4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input
          class="form-input"
          [(ngModel)]="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label class="form-label">Password</label>
        <a class="forgot-link" href="#">Forgot password?</a>
      </div>
      <div class="input-wrapper">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 16 16" fill="none">
          <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input
          class="form-input"
          [(ngModel)]="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>
    </div>

    <button class="login-btn" (click)="login()">
      Sign In
      <span class="login-btn__arrow">→</span>
    </button>

    <div class="divider">
      <span class="divider__line"></span>
      <span class="divider__text">or</span>
      <span class="divider__line"></span>
    </div>

    <button class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <p class="bottom-text">
      New to Cooksy?
      <a class="bottom-link" routerLink="/register">Create account</a>
    </p>

  </div>

</div>
