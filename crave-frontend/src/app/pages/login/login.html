<div class="login-page">

  <div class="login-card">

    <div class="logo">
      🍳
    </div>

    <h1>Welcome back</h1>

    <p class="subtitle">
      Sign in to continue your Cooksy journey
    </p>

    <div class="form-group">

      <label>Email</label>

      <input
        [(ngModel)]="email"
        placeholder="Enter your email">

    </div>

    <div class="form-group">

      <label>Password</label>

      <input
        [(ngModel)]="password"
        type="password"
        placeholder="Enter your password">

    </div>

    <button
      class="login-btn"
      (click)="login()">

      Login

    </button>

    <div class="divider">
      OR
    </div>

    <button class="google-btn">
      Continue with Google
    </button>

    <p class="bottom-text">
      New to Cooksy?
      <span>Create account</span>
    </p>

  </div>

</div>
